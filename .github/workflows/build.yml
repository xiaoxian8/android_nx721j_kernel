name: Build Nubia Z60 Ultra Kernel

on:
  workflow_dispatch:
    # ... 输入参数省略，与之前相同

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout 内核源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: /home/runner/android_kernel/android_nx721j_kernel

      - name: 释放磁盘空间
        run: |
          echo "=== Before ==="; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          echo "=== After ==="; df -h /

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache cpio curl flex git \
            device-tree-compiler kmod libelf-dev libssl-dev \
            patch python3 rsync unzip wget zip

      - name: 编译内核
        env:
          KERNELSU_TAG_IN: ${{ inputs.kernelsu_tag || '3' }}
          # ... 其他环境变量保持不变
        run: |
          cd $HOME/android_kernel/android_nx721j_kernel
          chmod +x build.sh
          printf '%s\n' \
            "${KERNELSU_TAG_IN}" \
            # ... 其他参数保持不变
          | bash build.sh

      # ... 后续步骤保持不变        description: 'Droidspaces 支持 (y/n)'
        required: true
        default: 'y'
        type: choice
        options: ['y', 'n']
      ssg:
        description: 'SSG IO 调度 (y/n)'
        required: true
        default: 'y'
        type: choice
        options: ['y', 'n']
      bbg:
        description: 'BBG 基带守护 (y/n)'
        required: true
        default: 'y'
        type: choice
        options: ['y', 'n']
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - '.github/**'

permissions:
  contents: read

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout 内核源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1          # 只留当前 commit，省磁盘

      # 关键：把源码挪到脚本期望的路径，让它跳过 git clone
      - name: 把源码放到脚本期望的位置
        run: |
          mkdir -p $HOME/android_kernel
          mv "$GITHUB_WORKSPACE" $HOME/android_kernel/android_nx721j_kernel
          cd $HOME/android_kernel/android_nx721j_kernel
          git status --short | head
          git log -1 --oneline

      - name: 释放磁盘空间
        run: |
          echo "=== Before ==="; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          echo "=== After ==="; df -h /

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache cpio curl flex git \
            device-tree-compiler kmod libelf-dev libssl-dev \
            patch python3 rsync unzip wget zip

      - name: 环境信息
        run: |
          echo "HOME=$HOME"
          nproc --all
          free -h
          df -h
          which dtc && dtc --version || true

      - name: 编译内核
        env:
          KERNELSU_TAG_IN: ${{ inputs.kernelsu_tag || '3' }}
          SUSFS_IN:        ${{ inputs.susfs        || 'y' }}
          NET_IN:          ${{ inputs.netfilter    || 'y' }}
          BBR_IN:          ${{ inputs.bbr          || 'y' }}
          MFY_IN:          ${{ inputs.mountify     || 'y' }}
          DS_IN:           ${{ inputs.droidspaces  || 'y' }}
          SSG_IN:          ${{ inputs.ssg          || 'y' }}
          BBG_IN:          ${{ inputs.bbg          || 'y' }}
        run: |
          cd $HOME/android_kernel/android_nx721j_kernel
          chmod +x build.sh
          # 按 read -p 出现的顺序依次喂入答案
          printf '%s\n' \
            "${KERNELSU_TAG_IN}" \
            "${SUSFS_IN}" \
            "${NET_IN}" \
            "${BBR_IN}" \
            "${MFY_IN}" \
            "${DS_IN}" \
            "${SSG_IN}" \
            "${BBG_IN}" \
          | bash build.sh

      - name: 列出产物
        if: always()
        run: |
          ls -lh $HOME/android_kernel/nx721j_out/ 2>/dev/null || echo "无输出目录"

      - name: 上传 AnyKernel3 刷机包
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-run${{ github.run_number }}
          path: /home/runner/android_kernel/nx721j_out/*.zip
          if-no-files-found: error
          retention-days: 30
