name: Build with KernelSU

on:
workflow_dispatch:
inputs:
KSU_BRANCH:
description: '请选择KernelSU分支'
required: true
type: choice
options:
- 'KernelSU'
- 'KernelSU-Next'
- 'ReSukiSU'
- 'NO KernrlSU'
default: KernelSU-Next

SuSFS_STAT:  
    description: 'SuSFS'  
    required: true  
    type: choice  
    options:  
      - 'YES'  
      - 'NO'  
    default: 'YES'  
  SSG_IO:  
    description: 'SSG IO调度'  
    required: true  
    type: choice  
    options:  
      - 'YES'  
      - 'NO'  
    default: 'YES'  
  MFY_STAT:  
    description: 'Mountify支持'  
    required: true  
    type: choice  
    options:  
      - 'YES'  
      - 'NO'  
    default: 'YES'  
  IPS_STAT:  
    description: 'Netfilter / IPSET'  
    required: true  
    type: choice  
    options:  
      - 'YES'  
      - 'NO'  
    default: 'YES'  
  BBR_STAT:  
    description: 'BBR 拥塞控制'  
    required: true  
    type: choice  
    options:  
      - 'YES'  
      - 'NO'  
    default: 'YES'

jobs:
build:

env:  
  PATH: 'build-tools/llvm22/bin:${PATH}'  
  AVBTOOL: 'build-tools/linux-x86/bin/avbtool'  
  MKBOOTIMG: 'build-tools/mkbootimg/mkbootimg.py'  
  BOOT_SIGN_KEY_PATH: 'build-tools/linux-x86/share/avb/testkey_rsa2048.pem'  
  DEFCONFIG_FILE: 'arch/arm64/configs/gki_defconfig'  
  OUT_DIR: 'out'  
  

runs-on: ubuntu-latest  

steps:  
- uses: actions/checkout@v4  
  with:  
      submodules: recursive  

- name: 安装构建工具  
  run: |  
    sudo apt update && sudo apt-get install -y curl bison flex make binutils dwarves git lld pahole zip perl gcc python3 python-is-python3 bc libssl-dev libelf-dev device-tree-compiler kmod binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi  

- name: 下载构建工具以及AnyKernel3  
  run: |  
    git clone https://android.googlesource.com/kernel/prebuilts/build-tools -b main-kernel-2025 --depth 1  
    git clone https://android.googlesource.com/platform/system/tools/mkbootimg -b main-kernel-2025 --depth 1 build-tools/mkbootimg  
    wget https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.5/LLVM-22.1.5-Linux-X64.tar.xz  
    tar -xf LLVM-22.1.5-Linux-X64.tar.xz  
    mv LLVM-22.1.5-Linux-X64 build-tools/llvm22  
    rm LLVM-22.1.5-Linux-X64.tar.xz  
    git clone https://github.com/Kernel-SU/AnyKernel3.git --depth 1  

- name: 补丁流程
  run: |
    kernelsu(){
      curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
    }
    ksun(){
      curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/refs/heads/dev-susfs/kernel/setup.sh" | bash -s dev
    }
    ksun_susfs(){
      curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/refs/heads/dev-susfs/kernel/setup.sh" | bash -s dev-susfs
      git clone https://gitlab.com/pershoot/susfs4ksu.git -b gki-android14-6.1-dev --depth=1
      cp susfs4ksu/kernel_patches/include ./ -r
      cp susfs4ksu/kernel_patches/fs ./ -r
      patch -p1 -F3 < susfs4ksu/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch
    }
    }
    resukisu(){
      curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
    }
    susfs_patch(){
      git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android14-6.1-dev --depth=1 ${HOME}/android_kernel/susfs4ksu
      cp susfs4ksu/kernel_patches/include ./ -r
      cp susfs4ksu/kernel_patches/fs ./ -r
      patch -p1 -F3 < susfs4ksu/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch
    }
    ksu_patch(){
      patch -p1 -d KernelSU -F3 < susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch
    }
- name: 执行输入环境变量
  run: |
    case "${{ inputs.KSU_BRANCH }}" in
      KernelSU|ReSuKiSU)
      if [[ '${{ inputs.SuSFS_STAT' == 'YES' }} ]]: then
        susfs_patch
      fi
      if [[ '${{ inputs.KSU_BRANCH }}' = 'KernelSU']]
